name: refresh-signal-scout

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Refresh Signal Scout
        run: python work/agent/run.py

      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/agent/digests/
          if git diff --staged --quiet; then
            echo "No digest changes to commit."
            exit 0
          fi
          git commit -m "chore(agent): weekly refresh signal digest"
          git push
