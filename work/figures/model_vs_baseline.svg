<svg xmlns="http://www.w3.org/2000/svg" class="chart" role="img" aria-label="Random forest and baseline Precision at 50 across three checks, with the base rate marked" viewBox="0 0 640 380" width="100%">
<style>
  .chart { color: var(--text, #1a1a1a); }
  .chart text { fill: currentColor; font-family: "Source Serif 4", Georgia, serif; }
  .axis, .grid { stroke: var(--rule, #e2e0d8); }
  .axis { fill: none; }
  .rf { fill: var(--accent, #3b4cca); }
  .bl { fill: var(--bar-baseline, #b7b4ac); }
  .zero { fill: var(--muted, #5c5a55); }
  @media (prefers-color-scheme: dark) {
    .chart {
      color: var(--text, #e8e6e1);
      --accent: #9aa6ff;
      --rule: #3a3934;
      --bar-baseline: #8d8a82;
      --muted: #b1aea6;
    }
  }
</style>

<line class="axis" x1="52" y1="28" x2="52" y2="268"/>
<line class="axis" x1="52" y1="268" x2="616" y2="268"/>
