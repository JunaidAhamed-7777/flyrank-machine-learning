<text x="44" y="97.5" text-anchor="end" font-size="12">0.4</text>
<line class="grid" x1="52" y1="49.8" x2="616" y2="49.8" stroke-dasharray="2 4"/>
<text x="44" y="53.8" text-anchor="end" font-size="12">0.5</text>
